<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidyut Quiz · MITS Gwalior</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070b1a;--bg2:#0d1430;--card:rgba(20,28,58,.72);--tx:#eaf0ff;--mu:#8e9bc4;--ac:#ffd60a;--ac2:#22d3ee;--ok:#2ee59d;--bad:#ff5470;--bd:rgba(120,150,255,.18);--hd:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;
 background:radial-gradient(900px 500px at 85% -10%,rgba(34,211,238,.18),transparent 60%),radial-gradient(800px 500px at -10% 10%,rgba(255,214,10,.13),transparent 55%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 70%)}
.top{position:relative;max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:12px}
.top svg{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(255,214,10,.7));animation:pulse 2.4s ease-in-out infinite}
.top b{display:block;font:700 22px/1 var(--hd);letter-spacing:.32em;color:var(--ac)}.top small{color:var(--mu);font-size:12px;letter-spacing:.08em}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
main{position:relative;max-width:860px;margin:0 auto;padding:10px 16px 28px}
h1{font:700 34px/1.15 var(--hd);margin:14px 0 4px}h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 20px/1.3 var(--hd);margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:rise .4s ease both}
button{font:600 15px var(--hd);cursor:pointer;border:0;border-radius:12px;padding:11px 18px;color:#1a1400;background:linear-gradient(135deg,var(--ac),#ffb703);box-shadow:0 4px 18px rgba(255,214,10,.28);transition:transform .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,214,10,.4)}
button.sec{background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--bd);box-shadow:none}button.sec:hover:not(:disabled){border-color:var(--ac2);box-shadow:0 0 18px rgba(34,211,238,.25)}
button.kbc{background:linear-gradient(135deg,#f72585,#7209b7);color:#fff;box-shadow:0 4px 20px rgba(247,37,133,.45)}
button.kbc:hover:not(:disabled){box-shadow:0 6px 26px rgba(247,37,133,.7)}
button.warn{background:linear-gradient(135deg,#ff5470,#d90429);color:#fff;box-shadow:0 4px 18px rgba(255,84,112,.3)}
button.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{color:var(--tx)!important;-webkit-text-fill-color:var(--tx)!important;caret-color:var(--ac);font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(7,11,26,.7);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(34,211,238,.2)}input::placeholder,textarea::placeholder{color:var(--mu);-webkit-text-fill-color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1 1 200px}
.code{font:700 52px/1 var(--hd);letter-spacing:.18em;color:var(--ac);text-shadow:0 0 22px rgba(255,214,10,.55)}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:15px 18px;background:rgba(7,11,26,.6);color:var(--tx);border:2px solid var(--bd);box-shadow:none;font:500 16px Inter,sans-serif}
.opt:hover:not(:disabled){border-color:var(--ac2);background:rgba(34,211,238,.08);box-shadow:0 0 20px rgba(34,211,238,.18)}
.opt.sel{border-color:var(--ac);background:rgba(255,214,10,.1)}.opt.ok{border-color:var(--ok);background:rgba(46,229,157,.14)}.opt.no{border-color:var(--bad);background:rgba(255,84,112,.12)}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font:600 12px var(--hd);letter-spacing:.1em;text-transform:uppercase}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
tr:nth-child(2) td:first-child{color:#ffd60a;font-weight:700}tr:nth-child(3) td:first-child{color:#cfd8ee;font-weight:700}tr:nth-child(4) td:first-child{color:#e8a06a;font-weight:700}
tr:nth-child(2) td{background:linear-gradient(90deg,rgba(255,214,10,.1),transparent)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font:700 11px var(--hd);letter-spacing:.06em;background:linear-gradient(135deg,var(--ok),var(--ac2));color:#04201a}
.tag.danger{background:linear-gradient(135deg,#ff5470,#e63946);color:#fff}
.tag.warn{background:linear-gradient(135deg,#ffd60a,#ff9f1c);color:#1a1400}
.tag.neutral{background:rgba(255,255,255,.08);color:var(--tx);border:1px solid var(--bd)}
.wrap{overflow-x:auto}.q{border:1px dashed var(--bd);border-radius:14px;padding:14px;margin:12px 0;background:rgba(7,11,26,.35)}
video{width:100%;border-radius:14px;background:#000;margin-top:12px}#qr{background:#fff;padding:10px;display:inline-block;border-radius:14px;box-shadow:0 0 30px rgba(34,211,238,.3)}
.hero p{margin:0 0 6px;color:var(--mu)}
/* Tabs */
.tabs{display:flex;gap:6px;margin:14px 0 10px;border-bottom:1px solid var(--bd);padding-bottom:10px}
.tab-btn{background:transparent;border:0;color:var(--mu);padding:8px 14px;font-size:14px;border-radius:8px;box-shadow:none}
.tab-btn.active{color:var(--ac);background:rgba(255,214,10,.12);box-shadow:none;font-weight:700}
.tab-btn:hover:not(.active){color:var(--tx);background:rgba(255,255,255,.04);transform:none}
/* Modal Backdrop */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:rise .25s ease both}
/* Pulse animation */
.kbc-pulse{animation:kbcPulse 1.8s infinite}
@keyframes kbcPulse{0%,100%{box-shadow:0 0 15px rgba(255,214,10,.25)}50%{box-shadow:0 0 35px rgba(247,37,133,.6);border-color:var(--ac)}}
footer{position:relative;max-width:860px;margin:0 auto;padding:8px 16px calc(34px + env(safe-area-inset-bottom));text-align:center;color:var(--mu);font-size:13px;letter-spacing:.03em}
footer b{color:var(--ac);font:700 15px var(--hd)}footer i{display:block;margin-top:4px;font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
@keyframes pulse{50%{transform:scale(1.08);filter:drop-shadow(0 0 18px rgba(255,214,10,.95))}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){h1{font-size:28px}.code{font-size:40px}}
</style></head><body>
<div class="top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient></defs><path fill="url(#g)" d="M13.5 1 4 13.5h6.2L9 23l10-13.2h-6.4z"/></svg>
  <div><b>VIDYUT</b><small>MITS GWALIOR · TECH CLUB</small></div>
  <div class="top-actions" id="topNav"></div>
</div>
<main id="app"></main>
<div id="modalSlot"></div>
<footer><b>V</b>alue <b>I</b>s <b>D</b>oubled when <b>Y</b>outh <b>U</b>nderstand <b>T</b>echnology<i>Vidyut Club · MITS Gwalior</i></footer>
<script>
const $=s=>document.querySelector(s),app=$('#app'),modalSlot=$('#modalSlot');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Array.from({length:4},()=>Math.random().toString(36).slice(2)).join('');
let pid;try{pid=localStorage.pid||(localStorage.pid=uid())}catch(e){pid=uid()}
let ws,hello=null,hostCode=null,lastStr='',name=(()=>{try{return localStorage.qname||''}catch(e){return ''}})(),pw='',view=null,draft=null,scanStream=null,qrBox=null,qrFor='',isHost=false;
let hostTab='scores'; // 'scores' or 'switches'
let soundOn = localStorage.soundOn !== 'false';
let prevOptLive = null;
let joinCode='';

/* ---- Web Audio API / KBC Sound Synthesizer ---- */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audioCtx=new AC();
  }
  if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playKbcSound(){
  if(!soundOn) return;
  const a=new Audio('/kbc.mp3');
  a.play().catch(()=>synthKbcOptionsSting());
}
function playQuestionDrone(){
  if(!soundOn) return;
  const a=new Audio('/kbc-question.mp3');
  a.play().catch(()=>synthQuestionDrone());
}
function synthQuestionDrone(){
  const ctx=getAudioCtx(); if(!ctx) return;
  const t=ctx.currentTime;
  const osc=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(55,t);
  osc.frequency.exponentialRampToValueAtTime(73.4,t+1.4);
  f.type='lowpass'; f.frequency.setValueAtTime(140,t); f.frequency.linearRampToValueAtTime(320,t+1.6);
  g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.2,t+0.3); g.gain.exponentialRampToValueAtTime(0.001,t+2.6);
  osc.connect(f); f.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+2.7);
}
function synthKbcOptionsSting(){
  const ctx=getAudioCtx(); if(!ctx) return;
  const t=ctx.currentTime;
  // Sub impact
  const sub=ctx.createOscillator(), subG=ctx.createGain();
  sub.type='sine'; sub.frequency.setValueAtTime(110,t); sub.frequency.exponentialRampToValueAtTime(36,t+0.8);
  subG.gain.setValueAtTime(0.4,t); subG.gain.exponentialRampToValueAtTime(0.001,t+1.1);
  sub.connect(subG); subG.connect(ctx.destination);
  sub.start(t); sub.stop(t+1.15);
  // Layered tension chord: D2, A2, D3, F3, A3, D4
  [73.42, 110.00, 146.83, 174.61, 220.00, 293.66].forEach((fr, i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain(), fl=ctx.createBiquadFilter();
    o.type=i%2===0?'sawtooth':'triangle';
    o.frequency.setValueAtTime(fr, t);
    o.detune.setValueAtTime((i-3)*6, t);
    fl.type='lowpass'; fl.frequency.setValueAtTime(420, t);
    fl.frequency.exponentialRampToValueAtTime(1350, t+0.35);
    fl.frequency.exponentialRampToValueAtTime(500, t+2.0);
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.08, t+0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t+2.2);
    o.connect(fl); fl.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+2.3);
  });
  // High shimmer bell
  const bell=ctx.createOscillator(), bg=ctx.createGain();
  bell.type='sine'; bell.frequency.setValueAtTime(1174.66, t);
  bg.gain.setValueAtTime(0.12, t); bg.gain.exponentialRampToValueAtTime(0.001, t+1.4);
  bell.connect(bg); bg.connect(ctx.destination);
  bell.start(t); bell.stop(t+1.45);
}

function updateTopNav(){
  const el=$('#topNav'); if(!el) return;
  if(isHost){
    el.innerHTML=`<button class="sec btn-sm" id="sndToggle">${soundOn?'🔊 Sound ON':'🔇 Sound OFF'}</button>`;
    $('#sndToggle').onclick=()=>{
      soundOn=!soundOn; localStorage.soundOn=soundOn;
      if(soundOn) playKbcSound();
      updateTopNav();
    };
  } else {
    el.innerHTML='';
  }
}

/* ---- WebSocket Connection ---- */
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  ws.onopen=()=>hello&&hello();
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='error'){
      if(m.msg==='Wrong password'){pw='';sessionStorage.removeItem('pw');hello=null}
      if(m.msg==='No quiz found with that code.'&&!isHost){try{localStorage.removeItem('qcode')}catch(_){}if(!$('#err')){hello=null;home('')}} // saved quiz no longer exists
      const el=$('#err');if(el)el.textContent=m.msg;else alert(m.msg);return}
    if(m.t==='admin_ok'){sessionStorage.pw=pw;if(hostCode)tx({t:'open',code:hostCode});else hostHome();return}
    if(m.t==='list'){return hostList(m.items)}
    if(m.t==='quizzes'){return hostQuizzes(m.items)}
    if(m.t==='saved'){hostHome();return}
    if(m.t==='play'){
      if(!hello)return; // ignore stray updates after leaving a quiz
      if(e.data===lastStr)return;
      lastStr=e.data;
      if(joinCode){try{localStorage.qcode=joinCode}catch(_){}} // remember the quiz so reopening the page brings the player back to it
      if(m.cur>=0 && m.optLive && prevOptLive===false){
        playKbcSound();
      }
      prevOptLive=m.cur>=0 ? !!m.optLive : null;
    }
    view=m;
    if(m.t==='host'){
      hostCode=m.code;
      hostRender();
    } else {
      playRender();
    }
  };
  ws.onclose=()=>setTimeout(connect,1500);
}
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function route(){
  stopScan();closeModal();view=null;hello=null;lastStr='';hostCode=null;prevOptLive=null;joinCode='';
  isHost=location.hash==='#host';updateTopNav();
  if(isHost) return hostLogin();
  const hashCode=location.hash.slice(1).toUpperCase();
  let saved='';try{saved=localStorage.qcode||''}catch(_){}
  const code=hashCode||saved;
  // Reopening the site (or re-scanning the same QR) returns the player to the quiz they were in, including the final leaderboard
  if(/^[A-Z0-9]{5}$/.test(code)&&(!hashCode||hashCode===saved)) return autoJoin(code);
  home(hashCode);
}
function autoJoin(code){
  joinCode=code;
  app.innerHTML=`<div class="hero"><h1>Vidyut <span>Quiz</span></h1><p>Reconnecting to quiz ${esc(code)}…</p></div><div class="card"><button class="sec" id="other">Join a different quiz</button></div>`;
  $('#other').onclick=leaveQuiz;
  hello=()=>tx(name?{t:'join',code,name,pid}:{t:'view',code,pid});
  if(ws&&ws.readyState===1)hello();
}
function leaveQuiz(){
  tx({t:'leave'});
  try{localStorage.removeItem('qcode')}catch(_){}
  hello=null;view=null;lastStr='';joinCode='';
  if(location.hash) location.hash=''; else route(); // clearing the hash triggers route()
}
addEventListener('hashchange',route);

/* ---- Tab Switch Detection (Participant Anti-Cheat) ---- */
let lastTabReport=0;
function reportTabSwitch(){
  const now=Date.now();
  if(now-lastTabReport < 800) return;
  lastTabReport=now;
  if(ws && ws.readyState===1 && pid && view && view.status==='live'){
    tx({t:'tab_switch', pid});
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) reportTabSwitch(); });
window.addEventListener('blur',()=>{ reportTabSwitch(); });

/* ---- Modal Helper ---- */
function openModal(html){
  modalSlot.innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal-box">${html}</div></div>`;
  $('#modalBg').onclick=e=>{if(e.target.id==='modalBg') closeModal();};
}
function closeModal(){modalSlot.innerHTML='';}

/* ---- Participant Screen ---- */
function home(pre){
  app.innerHTML=`<div class="hero"><h1>Vidyut <span>Quiz</span></h1><p>Enter your name and the code on the big screen to join the battle ⚡</p></div><div class="card"><label class="mu">Your name</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Aarav"><div style="height:10px"></div>
  <label class="mu">Quiz code</label><input id="cd" maxlength="5" value="${esc(pre||'')}" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700">
  <div class="row" style="margin-top:14px"><button id="go">Join</button><button class="sec" id="scan">📷 Scan QR</button><button class="sec" id="viewlb">🏆 View leaderboard</button></div><p class="mu" style="margin:10px 0 0;font-size:13px">Left a finished quiz by accident? Enter its code and tap <b>View leaderboard</b>.</p><div id="scanbox"></div><p class="mu" id="err"></p></div>`;
  $('#go').onclick=()=>{const c=$('#cd').value.trim().toUpperCase(),n=$('#nm').value.trim();
    if(!n)return $('#err').textContent='Please enter your name.';if(!/^[A-Z0-9]{5}$/.test(c))return $('#err').textContent='Code must be 5 characters.';
    name=n;try{localStorage.qname=n}catch(e){}stopScan();joinCode=c;hello=()=>tx({t:'join',code:c,name:n,pid});hello()};
  $('#scan').onclick=startScan;
  $('#viewlb').onclick=()=>{const c=$('#cd').value.trim().toUpperCase();
    if(!/^[A-Z0-9]{5}$/.test(c))return $('#err').textContent='Enter the 5-character quiz code to view its leaderboard.';
    stopScan();joinCode=c;hello=()=>tx({t:'view',code:c,pid});hello()};
}
function playRender(){
  const v=view; if(!v) return;
  const ans=v.mine?.[v.cur];
  let h=`<div class="row"><h2 class="grow">${esc(v.title)}</h2><span class="mu">${esc(v.name)}</span></div>`;
  if(v.status==='ended') h+=`<div class="card"><h2>🏁 Quiz finished</h2>${v.me?`<p><b>You: #${v.me.rank} · ${v.me.score} ⚡</b>${v.me.adj?` <span class="tag neutral">${v.me.adj>0?'+':''}${v.me.adj} host adjustment</span>`:''}</p>`:'<p class="mu">Final leaderboard (view only).</p>'}${boardHTML(v.board,true)}<div class="row" style="margin-top:12px"><button class="sec" id="leaveQ">Join another quiz</button></div></div>`;
  else if(v.cur<0) h+=`<div class="card"><h2>Waiting for the host to start…</h2><p class="mu">You're in! The first question appears when the host is ready.</p></div>`;
  else {
    const rev=v.rev, locked=ans||rev!==null;
    h+=`<div class="card"><p class="mu">Question ${v.cur+1} of ${v.n}</p><h2>${esc(v.q.q)}</h2>`;
    // If options not yet live and answer not revealed:
    if(!v.optLive && rev===null){
      h+=`<div style="text-align:center;padding:26px 14px;border:1px dashed var(--ac2);border-radius:14px;background:rgba(34,211,238,.06);margin:14px 0" class="kbc-pulse">
        <div style="font-size:32px;animation:pulse 1.6s infinite">⏳</div>
        <h3 style="margin:8px 0 4px;font-family:var(--hd);color:var(--ac)">Question is Live!</h3>
        <p class="mu" style="margin:0">Options are locked. Host will reveal options soon...</p>
      </div>`;
    } else {
      h+=v.q.o.map((o,i)=>{let cl='opt';if(ans&&ans.c===i)cl+=' sel';if(rev!==null){if(i===rev)cl+=' ok';else if(ans&&ans.c===i)cl+=' no'}
        return `<button class="${cl}" data-i="${i}" ${locked?'disabled':''}>${'ABCDEF'[i]}. ${esc(o)}</button>`}).join('');
      h+=ans?`<p class="mu">✅ Answer locked in. Wait for the next question.</p>`:rev!==null?`<p class="mu">Time's up for this question.</p>`:'';
    }
    if(rev!==null&&ans) h+=`<p><b>${ans.c===rev?'🎉 Correct!':'❌ Not quite.'}</b> <span class="tag">+${v.pts??0} ⚡</span></p>`;
    h+='</div>';
    if(rev!==null) h+=`<div class="card"><h2>Leaderboard</h2>${boardHTML(v.board,false)}</div>`;
  }
  app.innerHTML=h;
  const lq=$('#leaveQ');if(lq)lq.onclick=leaveQuiz;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    getAudioCtx();
    tx({t:'answer',i:+b.dataset.i});
  });
}
function boardHTML(b,all){
  if(!b?.length) return '<p class="mu">No scores yet.</p>';
  const me=b.findIndex(r=>r.id===pid);
  return `<div class="wrap"><table><tr><th>#</th><th>Name</th><th>Vidyut ⚡</th></tr>${b.slice(0,all?50:10).map((r,i)=>`<tr ${r.id===pid?'style="font-weight:700"':''}><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join('')}</table></div>${me>=10&&!all?`<p class="mu">You: #${me+1} · ${b[me].score}</p>`:''}`;
}
async function startScan(){
  const er=$('#err');
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch{er.textContent='Camera unavailable (needs HTTPS or localhost). Type the code instead.';return}
  $('#scanbox').innerHTML='<video id="vid" playsinline muted></video>';const v=$('#vid');v.srcObject=scanStream;await v.play();
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  (function tick(){if(!scanStream)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
    const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
    if(r){const m=(r.data.split('#').pop()||'').trim().toUpperCase();if(/^[A-Z0-9]{5}$/.test(m)){$('#cd').value=m;stopScan();$('#scanbox').innerHTML='';er.textContent='Code scanned. Enter your name and join.';return}}}
    requestAnimationFrame(tick)})();
}
function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}

/* Template Quiz Editor */
function editor(){
  app.innerHTML=`<h1>${draft.id?'Edit':'Create'} quiz</h1><div class="card"><input id="t" placeholder="Quiz title" value="${esc(draft.title)}"></div><div id="qs"></div><div class="row"><button class="sec" id="add">+ Add question</button><button class="sec" id="save">💾 Save</button><button id="launch">🚀 Save &amp; launch</button><button class="sec" id="back">Cancel</button></div><p class="mu" id="err"></p>`;
  const paint=()=>{
    $('#qs').innerHTML=draft.qs.map((q,i)=>`<div class="card"><div class="row"><b class="grow">Question ${i+1}</b>
      <div style="display:flex;gap:4px">
        <button class="sec btn-sm" data-up="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="sec btn-sm" data-down="${i}" ${i===draft.qs.length-1?'disabled':''}>▼</button>
        ${draft.qs.length>1?`<button class="sec btn-sm" data-del="${i}">✕</button>`:''}
      </div>
    </div>
    <textarea rows="2" data-q="${i}" placeholder="Question text" style="margin-top:8px">${esc(q.q)}</textarea>
    ${q.o.map((o,j)=>`<div class="row" style="margin-top:8px"><input type="radio" name="r${i}" data-r="${i}:${j}" ${q.a===j?'checked':''} style="width:auto"><input class="grow" data-o="${i}:${j}" placeholder="Option ${'ABCD'[j]}" value="${esc(o)}"></div>`).join('')}<p class="mu">Select the radio button next to the correct option.</p></div>`).join('');
    app.querySelectorAll('[data-q]').forEach(e=>e.oninput=()=>draft.qs[+e.dataset.q].q=e.value);
    app.querySelectorAll('[data-o]').forEach(e=>e.oninput=()=>{const[a,b]=e.dataset.o.split(':');draft.qs[a].o[b]=e.value});
    app.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{const[a,b]=e.dataset.r.split(':');draft.qs[a].a=+b});
    app.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{draft.qs.splice(+e.dataset.del,1);paint()});
    app.querySelectorAll('[data-up]').forEach(e=>e.onclick=()=>{const i=+e.dataset.up;if(i>0){const tmp=draft.qs[i];draft.qs[i]=draft.qs[i-1];draft.qs[i-1]=tmp;paint()}});
    app.querySelectorAll('[data-down]').forEach(e=>e.onclick=()=>{const i=+e.dataset.down;if(i<draft.qs.length-1){const tmp=draft.qs[i];draft.qs[i]=draft.qs[i+1];draft.qs[i+1]=tmp;paint()}});
  };
  paint();$('#t').oninput=e=>draft.title=e.target.value;$('#add').onclick=()=>{draft.qs.push({q:'',o:['','','',''],a:0});paint()};$('#back').onclick=hostHome;
  const submit=launch=>{
    const qs=draft.qs.map(q=>({q:q.q.trim(),o:q.o.map(x=>x.trim()),a:q.a}));
    const fixed=qs.map(q=>{const keep=q.o.map((x,i)=>x?i:-1).filter(i=>i>=0);return{q:q.q,o:keep.map(i=>q.o[i]),a:keep.indexOf(q.a)}});
    if(!draft.title.trim()||fixed.some(q=>!q.q||q.o.length<2||q.a<0)){$('#err').textContent='Add a title, and for each question the text, at least 2 options, and a filled-in correct answer.';return}
    tx({t:'save_quiz',id:draft.id,title:draft.title,qs:fixed,launch});
  };
  $('#launch').onclick=()=>submit(true);$('#save').onclick=()=>submit(false);
}

  h+=`<div class="card">
    <div class="tabs">
      <button class="tab-btn ${hostTab==='scores'?'active':''}" id="tabScores">🏆 Score Leaderboard (${v.rows.length})</button>

  } else {

        const retake=$('#eqRetake').checked;
        if(!qText || opts.length<2 || ans>=opts.length){
          $('#eqErr').textContent='Please enter question text, at least 2 options, and select a valid correct answer.';
          return;
        }
        if(retake) playQuestionDrone();
        tx({t:'edit_session_question', idx, q:{q:qText, o:opts, a:ans}, retake, showOptions:false});
        closeModal();
      };
    };
  });

  // Reorder Questions in Session (Feature 3)
  app.querySelectorAll('[data-swup]').forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.swup;
      if(i>0) tx({t:'swap_session_questions', i, j:i-1});
    };
  });
  app.querySelectorAll('[data-swdn]').forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.swdn;
      if(i<n-1) tx({t:'swap_session_questions', i, j:i+1});
    };
  });
}

connect();
route();
setInterval(()=>{if(ws&&ws.readyState===1)tx({t:'ping'})},25000);
</script></body></html>
